[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coda-authorization"
version = "0.1.0"
description = "Bounded Chain-of-Delegation Authorization for Cross-Domain Industrial Digital Twin Agents"
requires-python = ">=3.9"
dependencies = [
    "cryptography>=42.0,<47.0",
    "PyJWT>=2.8,<3.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0"
]

[tool.setuptools.packages.find]
where = ["src"]
