name: CoDA Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test]"

      - name: Run test suite
        run: |
          python -m pytest -q

  opa-integration:
    name: Live OPA integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test]"

      - name: Start OPA
        run: |
          docker compose up -d

      - name: Wait for OPA
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8181/health > /dev/null; then
              echo "OPA is ready"
              exit 0
            fi
            sleep 1
          done

          echo "OPA failed to start"
          docker compose logs
          exit 1

      - name: Run live OPA integration tests
        env:
          RUN_OPA_INTEGRATION: "1"
        run: |
          python -m pytest tests/test_opa_integration.py -v

      - name: Show OPA logs on failure
        if: failure()
        run: |
          docker compose logs

      - name: Stop OPA
        if: always()
        run: |
          docker compose down
